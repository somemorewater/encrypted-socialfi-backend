# docker compose up --build                 -> 2 stateless API replicas behind nginx on http://localhost:8080
# docker compose up --build --scale api=4   -> scale out; no code changes needed (state lives in PostgreSQL)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socialfi
      POSTGRES_PASSWORD: socialfi
      POSTGRES_DB: socialfi
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialfi"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://socialfi:socialfi@db:5432/socialfi
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-0123456789}
      ENABLE_FAUCET: ${ENABLE_FAUCET:-true}
      TRUST_PROXY: "1"
    depends_on:
      db: { condition: service_healthy }
    deploy: { replicas: 2 }

  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]

volumes:
  pgdata:
